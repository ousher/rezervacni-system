<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rezervace stolu</title>
<meta name="description" content="Rezervace stolu online — potvrzení hned.">
<meta name="theme-color" content="#fbf8f3">
<style>
  /* ── VZHLED PODNIKU: tady se mění barva a písmo pro každého klienta ── */
  :root{
    --brand:#9c3d1c; --brand-ink:#fff; --brand-soft:#f6e7df;
    --bg:#fbf8f3; --card:#fff; --ink:#24201c; --dim:#6f6860; --line:#e7e0d6; --off:#c9c2b8;
    --ok:#2f7d4f; --r:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
  header{padding:26px 0 18px;border-bottom:1px solid var(--line)}
  header a{color:var(--dim);font-size:14px;text-decoration:none}
  h1{margin:8px 0 4px;font-size:27px;line-height:1.15;text-wrap:balance}
  .meta{color:var(--dim);font-size:14px}
  section{padding:22px 0;border-bottom:1px solid var(--line)}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  h2 b{color:var(--brand);margin-right:6px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-width:48px;height:48px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
        font:600 17px/1 var(--font);color:var(--ink);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .more{font-size:14px;color:var(--dim);margin-top:10px}
  .more a{color:var(--brand);font-weight:600}

  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .day{flex:0 0 auto;min-width:60px;text-align:center;padding:9px 6px;background:var(--card);border:1px solid var(--line);
       border-radius:var(--r);cursor:pointer;font:inherit;color:inherit}
  .day span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .day b{display:block;font-size:19px}
  .day:disabled{opacity:.4;cursor:not-allowed}
  .day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .day[aria-pressed=true] span{color:var(--brand-soft)}

  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .slot{height:46px;border-radius:10px;background:var(--card);border:1px solid var(--line);font:600 16px/1 var(--font);
        font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer}
  .slot:disabled{color:var(--off);text-decoration:line-through;cursor:not-allowed;background:transparent}
  .slot[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .empty{color:var(--dim);font-size:15px}

  .fields{display:grid;gap:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:480px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px;font-weight:600}
  input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
        font:16px var(--font);color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
  .gdpr{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin:4px 0 0}
  .gdpr input{width:auto;margin-top:4px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .sum{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
  .sum dt{color:var(--dim);font-size:14px}
  .sum dd{margin:0;text-align:right;font-weight:700}
  .go{width:100%;margin-top:14px;height:54px;border:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);
      font:700 17px var(--font);cursor:pointer}
  .go:disabled{background:var(--line);color:var(--dim);cursor:not-allowed}
  .hint{text-align:center;color:var(--dim);font-size:14px;margin-top:10px}
  .done{margin-top:16px;padding:16px;border-radius:var(--r);background:#eaf5ee;border:1px solid #b9dcc6}
  .done.err{background:#fbecea;border-color:#efc2bb}
  footer{padding:20px 0;text-align:center;color:var(--dim);font-size:13.5px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a id="back" href="/">← Zpět na web</a>
  <h1 id="vname">Rezervace stolu</h1>
  <div class="meta" id="vaddr"></div>
</header>

<section id="modeSec" hidden>
  <h2><b>★</b>Co chcete rezervovat?</h2>
  <div class="chips" id="mode"></div>
</section>

<section>
  <h2><b>1</b><span id="partyH">Kolik vás bude?</span></h2>
  <div class="chips" id="party"></div>
  <div class="more" id="more"></div>
</section>

<section id="durSec" hidden>
  <h2><b>⏱</b><span id="durH">Jak dlouho u nás budete?</span></h2>
  <div class="chips" id="dur"></div>
</section>

<section>
  <h2><b>2</b>Kdy?</h2>
  <div class="days" id="days"></div>
  <div class="meta" id="hours" style="margin-top:8px"></div>
</section>

<section>
  <h2><b>3</b>V kolik?</h2>
  <div class="slots" id="slots"><div class="empty">Vyberte počet osob a den.</div></div>
  <div class="meta" id="slotNote" style="margin-top:10px"></div>
</section>

<section>
  <h2><b>4</b>Kontakt</h2>
  <div class="fields">
    <div class="row">
      <div><label for="nm">Jméno</label><input id="nm" autocomplete="name" placeholder="Jana Nováková"></div>
      <div><label for="ph">Telefon</label><input id="ph" type="tel" autocomplete="tel" placeholder="+420 …"></div>
    </div>
    <div><label for="em">E-mail (nepovinné)</label><input id="em" type="email" autocomplete="email" placeholder="jana@email.cz"></div>
    <div><label for="nt">Poznámka (nepovinné)</label><textarea id="nt" maxlength="200" placeholder="dětská židlička, oslava, bezlepkové…"></textarea></div>
    <div class="hp" aria-hidden="true"><label for="web">Web</label><input id="web" tabindex="-1" autocomplete="off"></div>
    <label class="gdpr" for="ok"><input id="ok" type="checkbox"> <span id="gdprText">Souhlasím, aby podnik použil jméno a kontakt jen k vyřízení této rezervace (uvidí je obsluha, den po rezervaci se mažou).</span></label>
  </div>
</section>

<section style="border:0">
  <div class="sum"><dl>
    <dt id="s-pl">Osob</dt><dd id="s-p">—</dd>
    <dt id="s-wl" hidden>Co</dt><dd id="s-w" hidden>—</dd>
    <dt>Den</dt><dd id="s-d">—</dd>
    <dt>Čas</dt><dd id="s-t">—</dd>
  </dl></div>
  <button class="go" id="go" disabled>Rezervovat</button>
  <div class="hint" id="hint">Vyberte počet osob, den a čas.</div>
  <div class="done" id="done" role="status" hidden></div>
</section>
<footer id="foot"></footer>
</div>

<script src="rz-demo.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const DN = ['ne','po','út','st','čt','pá','so'], DNL = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const MN = ['led','úno','bře','dub','kvě','čer','čec','srp','zář','říj','lis','pro'];
const pad = n => String(n).padStart(2,'0');
const hhmm = m => `${pad(m===1440?24:Math.floor(m/60)%24)}:${pad(m%60)}`;
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const osob = p => p === 1 ? 'osoba' : p < 5 ? 'osoby' : 'osob';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st = {mode:'', p:null, dur:null, date:null, time:null}, loadedAt = Date.now();
const G = () => INFO && st.mode ? INFO.groups.find(g => g.id === st.mode) : null;
const PPL = p => { const w = (G() && G().people) || 'hráčů'; return w === 'osob' && p ? osob(p) : w; };   // skloňuje jen „osoba/osoby/osob“   // „hráčů“ u drah, „osob“ u kurzů
const hodin = m => (m/60).toString().replace('.', ',') + ' h';
const units = p => G() ? Math.ceil(p / G().per) : 0;
const SRC = (new URLSearchParams(location.search).get('z')||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);
let INFO = null, sending = false, times = null;

async function getJSON(u){ const r = await fetch(u, {cache:'no-store'}); const j = await r.json().catch(()=>({ok:false})); if(!r.ok||!j.ok) throw new Error(j.error||'Server neodpověděl.'); return j; }

(async function init(){
  try { INFO = await getJSON('dostupnost.php?info=1'); }
  catch(e){ $('slots').innerHTML = '<div class="empty">Rezervace teď nejde načíst. Zavolejte nám prosím.</div>'; return; }
  const v = INFO.venue;
  document.title = `Rezervace stolu — ${v.name}`;
  $('vname').textContent = v.name; $('vaddr').textContent = v.address;
  $('back').href = v.web || '/';
  $('foot').innerHTML = `${esc(v.name)} · ${esc(v.address)} · <a href="tel:${esc(v.phone.replace(/[^+\d]/g,''))}" style="color:inherit">${esc(v.phone)}</a>`;
  $('gdprText').textContent = `Souhlasím, aby ${v.name} použil(a) jméno a kontakt jen k vyřízení této rezervace (uvidí je obsluha, den po rezervaci se mažou).`;
  if (v.brand) document.documentElement.style.setProperty('--brand', v.brand);
  const ICON = {bowling:'🎳', kulecnik:'🎱', pool:'🎱', karambol:'🎱', snooker:'🎱', sipky:'🎯', darts:'🎯', lezeni:'🧗'};
  const modes = (INFO.tables ? [['', '🍽️ Stůl']] : []).concat(INFO.groups.map(g => [g.id, `${ICON[g.id] || '⏱'} ${g.label}`]));
  if (modes.length > 1) { $('modeSec').hidden = false; $('mode').innerHTML = modes.map(([id, t]) => `<button class="chip" data-m="${id}" aria-pressed="false">${t}</button>`).join(''); }
  st.mode = modes[0][0];
  const qm = new URLSearchParams(location.search).get('co'); if (qm && modes.some(m => m[0] === qm)) st.mode = qm;
  drawParty();
  const t0 = new Date(INFO.today+'T12:00:00');
  let html = '';
  for (let i = 0; i < INFO.daysAhead; i++){
    const d = new Date(t0); d.setDate(t0.getDate()+i);
    const closed = !INFO.hours[d.getDay()];
    html += `<button class="day" data-d="${iso(d)}" aria-pressed="false" ${closed?'disabled title="zavřeno"':''}><span>${i===0?'dnes':i===1?'zítra':DN[d.getDay()]}</span><b>${d.getDate()}.</b><span>${MN[d.getMonth()]}</span></button>`;
  }
  $('days').innerHTML = html;
  paint();
})();

function drawParty(){
  const g = G(), n = g ? g.per * g.maxUnits : INFO.maxParty, v = INFO.venue, tel = `<a href="tel:${esc(v.phone.replace(/[^+\d]/g,''))}">${esc(v.phone)}</a>`;
  $('partyH').textContent = g ? (g.askP || 'Kolik vás bude hrát?') : 'Kolik vás bude?';
  $('durH').textContent = g ? (g.askDur || 'Jak dlouho budete hrát?') : 'Jak dlouho u nás budete?';
  $('party').innerHTML = Array.from({length:n}, (_,i) => `<button class="chip" data-p="${i+1}" aria-pressed="false">${i+1}</button>`).join('');
  $('more').innerHTML = g ? (g.note ? `${esc(g.note)} ${tel}.` : `Na jednu ${esc(g.unit)} až ${g.per} ${esc(PPL())} — víc ${esc(PPL())} dostane víc drah najednou (nejvýš ${g.maxUnits}). Větší akce: ${tel}.`)
                          : (v.bigParty ? `${esc(v.bigParty)} ${tel}.` : `Víc než ${n}? Zavolejte nám: ${tel} — spojíme stoly.`);
  $('durSec').hidden = !g;
  if (g){ const opts = []; for (let m = g.min; m <= g.max; m += g.step) opts.push(m);
    if (!opts.includes(st.dur)) st.dur = opts.includes(60) ? 60 : opts[0];
    $('dur').innerHTML = opts.map(m => `<button class="chip" data-d="${m}" aria-pressed="false">${hodin(m)}</button>`).join(''); }
}
$('mode').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; st.mode = b.dataset.m; st.p = null; st.time = null; drawParty(); load(); };
$('dur').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; st.dur = +b.dataset.d; st.time = null; load(); };
$('party').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; st.p = +b.dataset.p; st.time = null; load(); };
$('days').onclick = e => { const b = e.target.closest('[data-d]'); if (!b || b.disabled) return; st.date = b.dataset.d; st.time = null; load(); };
$('slots').onclick = e => { const b = e.target.closest('[data-t]'); if (!b || b.disabled) return; st.time = b.dataset.t; paint(); };
['nm','ph','em','nt','ok'].forEach(id => { $(id).addEventListener('input', summary); $(id).addEventListener('change', summary); });

async function load(){
  times = null; paint();
  if (!st.p || !st.date) return;
  const key = () => `${st.mode}|${st.date}|${st.p}|${st.dur}`, want = key();
  try {
    const j = await getJSON(st.mode ? `dostupnost.php?g=${st.mode}&date=${st.date}&p=${st.p}&dur=${st.dur}` : `dostupnost.php?date=${st.date}&p=${st.p}`);
    if (want === key()) { times = j.times; paint(); }
  } catch(e){ $('slots').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function paint(){
  document.querySelectorAll('#party .chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.p === st.p)));
  document.querySelectorAll('#mode .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === st.mode)));
  document.querySelectorAll('#dur .chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.d === st.dur)));
  document.querySelectorAll('#days .day').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === st.date)));
  if (INFO && st.date){
    const h = (G() ? G().hours : INFO.hours)[new Date(st.date+'T12:00:00').getDay()];
    $('hours').textContent = h ? `Otevřeno ${hhmm(h[0])}–${hhmm(h[1])}` : 'Zavřeno';
  }
  const box = $('slots');
  if (!st.p || !st.date) box.innerHTML = '<div class="empty">Vyberte počet osob a den.</div>';
  else if (!times) box.innerHTML = '<div class="empty">Načítám volné časy…</div>';
  else if (!times.length) box.innerHTML = '<div class="empty">Na tento den už online rezervovat nejde. Zavolejte nám prosím.</div>';
  else if (!times.some(t => t[1])) box.innerHTML = `<div class="empty">${G() ? `Na ${hodin(st.dur)} pro ${st.p} ${PPL(st.p)}` : `Pro ${st.p} ${osob(st.p)}`} už je tento den plno. Zkuste jiný den${G() ? ' nebo kratší hru' : ''}, nebo nám zavolejte.</div>`;
  else box.innerHTML = times.map(([t, free]) => `<button class="slot" data-t="${t}" ${free?'':'disabled'} aria-pressed="${t===st.time}">${t}</button>`).join('');
  $('slotNote').textContent = !(times && times.some(t => t[1]) && INFO) ? '' : G()
    ? `Čas = začátek. Přeškrtnuté časy jsou plné. ${st.p} ${PPL(st.p)} = ${units(st.p)} × ${G().unit}.`
    : `Přeškrtnuté časy jsou pro ${st.p} ${osob(st.p)} plné. Stůl držíme ${INFO.sit >= 60 ? hodin(INFO.sit) : INFO.sit + ' min'}.`;
  summary();
}

function summary(){
  const d = st.date ? new Date(st.date+'T12:00:00') : null;
  $('s-p').textContent = st.p ? (G() ? `${st.p} ${PPL(st.p)}` : `${st.p} ${osob(st.p)}`) : '—';
  $('s-pl').textContent = G() ? PPL().replace(/^./, c => c.toUpperCase()) : 'Osob';
  $('s-wl').hidden = $('s-w').hidden = !G();
  if (G()) $('s-w').textContent = `${G().label} · ${st.p ? units(st.p) + ' × ' + G().unit + ' · ' : ''}${hodin(st.dur)}`;
  $('s-d').textContent = d ? `${DNL[d.getDay()]} ${d.getDate()}. ${d.getMonth()+1}.` : '—';
  $('s-t').textContent = st.time || '—';
  const pick = st.p && st.date && st.time, nm = $('nm').value.trim(), ph = $('ph').value.trim(), ok = $('ok').checked;
  $('go').disabled = !(pick && nm && ph && ok) || sending;
  $('hint').textContent = !pick ? 'Vyberte počet osob, den a čas.' : !nm ? 'Doplňte jméno.' : !ph ? 'Doplňte telefon — kdyby se něco změnilo.'
    : !ok ? 'Potvrďte souhlas se zpracováním kontaktu.' : 'Rezervace se potvrdí hned po odeslání.';
}

$('go').onclick = async () => {
  sending = true; summary(); $('go').textContent = 'Odesílám…';
  const box = $('done');
  try {
    const r = await fetch('odeslat.php', {method:'POST', body:new URLSearchParams({
      date:st.date, time:st.time, p:String(st.p), g:st.mode, dur:String(st.dur||''), name:$('nm').value.trim(), phone:$('ph').value.trim(),
      email:$('em').value.trim(), note:$('nt').value.trim(), web:$('web').value, z:SRC,
      t:String(Math.round((Date.now()-loadedAt)/1000))})});
    const j = await r.json().catch(()=>({ok:false}));
    if (!r.ok || !j.ok) throw new Error(j.error || '');
    box.className = 'done';
    box.innerHTML = `<b>Rezervace potvrzena ✔</b><br>${esc($('s-d').textContent)} v ${esc(j.time)} · ${G() ? `${esc(G().label)}, ${j.units} × ${esc(G().unit)}, ${hodin(st.dur)}` : `${j.p} ${osob(j.p)}`}<br>`
      + `<span class="meta">Číslo rezervace ${esc(j.ref)}. Kdyby se něco změnilo, zavolejte nám na ${esc(INFO.venue.phone)}.</span>`;
    $('go').textContent = 'Rezervováno ✔';
  } catch(e){
    box.className = 'done err';
    box.innerHTML = `<b>Rezervace se nepovedla.</b><br>${esc(e.message || 'Zkuste to prosím znovu.')}`;
    sending = false; $('go').textContent = 'Rezervovat'; st.time = null; load();
  }
  box.hidden = false; box.scrollIntoView({behavior:'smooth', block:'nearest'});
};
</script>
</body>
</html>
